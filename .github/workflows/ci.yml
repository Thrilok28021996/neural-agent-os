name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"

jobs:
  frontend:
    name: Frontend (TypeScript + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc -b

      - name: Run frontend tests
        run: npm test

      - name: Production build
        run: npm run build

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             librsvg2-dev             patchelf             libssl-dev             libgtk-3-dev             libayatana-appindicator3-dev             libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check (lib)
        working-directory: src-tauri
        run: cargo check --lib

      - name: Cargo check (examples)
        working-directory: src-tauri
        run: cargo check --examples

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Run integration tests
        working-directory: src-tauri
        run: cargo test --test logging_smoke

  tauri-build:
    name: Tauri Build (${{ matrix.platform.os }})
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            os: ubuntu
          - platform: macos-latest
            os: macos
          - platform: windows-latest
            os: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             librsvg2-dev             patchelf             libssl-dev             libgtk-3-dev             libayatana-appindicator3-dev             libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: '--config bundle.createUpdaterArtifacts=false' 
